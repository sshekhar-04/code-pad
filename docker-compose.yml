version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codepad_app
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST_SQL: db
      DB_PORT_SQL: "3306"
      DB_DATABASE_SQL: codepad
      DB_USERNAME_SQL: codepad_user
      DB_PASSWORD_SQL: codepad_secret
      CODE_EXECUTION_DRIVER: piston
      PISTON_API_URL: https://emkc.org/api/v2/piston/execute
    depends_on:
      db:
        condition: service_healthy
    networks:
      - codepad-net

  db:
    image: mysql:5.7
    container_name: codepad_db
    restart: unless-stopped
    ports:
      - "33060:3306"
    environment:
      MYSQL_DATABASE: codepad
      MYSQL_USER: codepad_user
      MYSQL_PASSWORD: codepad_secret
      MYSQL_ROOT_PASSWORD: root_secret_password
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "codepad_user", "-pcodepad_secret"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - codepad-net

volumes:
  db_data:
    driver: local

networks:
  codepad-net:
    driver: bridge
